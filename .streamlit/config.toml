[server]
headless = true
maxUploadSize = 50
# CORS and XSRF protection are left at their defaults (on). Streamlit warns
# that turning CORS off would accept a WebSocket from any origin, which is not
# something you want in front of your accounts.

[browser]
gatherUsageStats = false

[theme]
# base is deliberately NOT set. Pinning it to "light" forced light mode on
# everyone and disabled Streamlit's own theme switcher. Left unset, the app
# follows the reader's system preference and the choice they make under
# ☰ > Settings > Theme (Light / Dark / Use system setting).
